name: Quarto Publish

# Dormant on feature branches: fires only on pushes to main and manual runs.
# One-time setup at merge: run `quarto publish gh-pages` locally once (creates
# _publish.yml and the gh-pages branch), switch Pages source to gh-pages, and
# grant Actions write permission in repo settings.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
